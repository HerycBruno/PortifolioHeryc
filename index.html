<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandeira LGBT</title>

<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #e5e5e5;
        font-family: Arial, sans-serif;
    }

    .bandeira {
        width: 600px;
        height: 360px;
        border: 3px solid #222;
        box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }

    .faixa {
        height: calc(100% / 6);
    }

    .vermelho { background: #E40303; }
    .laranja  { background: #FF8C00; }
    .amarelo  { background: #FFED00; }
    .verde    { background: #008026; }
    .azul     { background: #004DFF; }
    .roxo     { background: #750787; }
</style>
</head>
<body>

<div class="bandeira">
    <div class="faixa vermelho"></div>
    <div class="faixa laranja"></div>
    <div class="faixa amarelo"></div>
    <div class="faixa verde"></div>
    <div class="faixa azul"></div>
    <div class="faixa roxo"></div>
</div>

</body>
</html>
